# Configuración del Worker.
# El entorno por defecto es DESARROLLO (tokalo-dev en workers.dev).
# Producción (tokaloperu.com) está al final, en [env.produccion], y solo se
# despliega pidiéndolo a propósito:  npm run desplegar:produccion
# Así un "wrangler deploy" a secas nunca toca el dominio real.

name = "tokalo-dev"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = true

# Valores de configuración que el Worker lee como `env.NOMBRE`.
[vars]
WHATSAPP = "51913629134"   # código de país + número, solo dígitos
# Dirección pública de este entorno: con ella se arman los links de las placas.
URL_BASE = "https://tokalo-dev.tokaloperu.workers.dev"

# Logs del Worker: guarda cada solicitud y cada console.error. Se ven en el
# panel de Cloudflare: Workers & Pages > tokalo-dev > Observability.
# Gratis hasta 200 000 eventos al día. Las trazas no nos hacen falta.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

# Base de datos D1 de desarrollo. El Worker la ve como `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "tokalo-dev"
database_id = "423ca62c-5407-4431-bb2c-953e4fe7a929"
migrations_dir = "migrations"


# ───────────────────────── PRODUCCIÓN ─────────────────────────
# Worker "tokalo" en tokaloperu.com. Los entornos no heredan variables ni
# bases de datos, por eso se repiten aquí con sus valores de producción.
[env.produccion]
name = "tokalo"
workers_dev = false      # sin dirección *.workers.dev: solo el dominio propio
preview_urls = false
# Cloudflare crea solo los registros DNS y el certificado de cada dominio.
routes = [
  { pattern = "tokaloperu.com", custom_domain = true },
  { pattern = "www.tokaloperu.com", custom_domain = true },   # redirige a la raíz
]

[env.produccion.vars]
WHATSAPP = "51913629134"
URL_BASE = "https://tokaloperu.com"

[env.produccion.observability.logs]
enabled = true
invocation_logs = true

[env.produccion.observability.traces]
enabled = false

[[env.produccion.d1_databases]]
binding = "DB"
database_name = "tokalo"
database_id = "b08ab1ce-7093-45b0-8e64-4d13e1f2645c"
migrations_dir = "migrations"
